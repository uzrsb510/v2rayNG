name: Build APK Test

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;37.0.0
            platform-tools

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

      - name: Build native library
        run: |
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Download Xray library
        run: |
          cd AndroidLibXrayLite
          TAG=$(git describe --tags --abbrev=0)
          cd ..
          mkdir -p V2rayNG/app/libs
          curl -fL \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" \
            -o V2rayNG/app/libs/libv2ray.aar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SabzVPN-test-apk
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
